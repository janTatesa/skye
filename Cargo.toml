[package]
name = "skye"
version = "0.1.0"
edition = "2024"

[dependencies]
jiff = { version = "0.2.31", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
dirs = "7.0.0"
smol = "2.0.2"
clap = { version = "4.6.7", features = ["cargo", "derive"] }
color-eyre = "0.6.5"
futures = "0.3.34"
notify-rust = "4.18.1"
log = "0.4.34"
env_logger = "0.11.11"
owo-colors = "4.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
